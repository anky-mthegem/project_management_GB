{% extends 'base.html' %}

{% block title %}Change Password - Milestone Management{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-slate-50 via-slate-100 to-slate-200 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950"
     x-data="{
         showOld: false,
         showNew: false,
         showConfirm: false,
         oldPassword: '',
         newPassword: '',
         confirmPassword: '',
         get isMatching() {
             return this.confirmPassword === '' || this.newPassword === this.confirmPassword;
         }
     }">

    <!-- Change Password Card -->
    <div class="max-w-md w-full space-y-6 bg-white/95 dark:bg-slate-900/90 p-7 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl backdrop-blur-xl">
        
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto mb-3 w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950/60 border border-brand-200 dark:border-brand-800/60 text-brand-600 dark:text-brand-400 flex items-center justify-center shadow-sm">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                Change Password
            </h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Update account login credentials for <span class="font-semibold text-slate-700 dark:text-slate-300">@{{ user.username }}</span>
            </p>
        </div>

        <!-- Form -->
        <form class="space-y-4" method="POST" action="{% url 'change_password' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next|default:'dashboard' }}">

            <!-- Current Password -->
            <div>
                <label for="id_old_password" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                    Current Password <span class="text-rose-500">*</span>
                </label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input id="id_old_password" name="old_password" :type="showOld ? 'text' : 'password'" required autofocus
                           x-model="oldPassword"
                           class="block w-full pl-9 pr-10 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           placeholder="Enter your current password">
                    <button type="button" @click="showOld = !showOld" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i :data-lucide="showOld ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- New Password -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="id_new_password1" class="block text-xs font-medium text-slate-700 dark:text-slate-300">
                        New Password <span class="text-rose-500">*</span>
                    </label>
                    <span class="text-[10px] text-slate-400 dark:text-slate-500 font-mono">Min 8 chars (Upper, Lower, Number, Special)</span>
                </div>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                    </div>
                    <input id="id_new_password1" name="new_password1" :type="showNew ? 'text' : 'password'" required
                           x-model="newPassword"
                           class="block w-full pl-9 pr-10 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           placeholder="Enter new strong password">
                    <button type="button" @click="showNew = !showNew" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i :data-lucide="showNew ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div>
                <label for="id_new_password2" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                    Confirm New Password <span class="text-rose-500">*</span>
                </label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </div>
                    <input id="id_new_password2" name="new_password2" :type="showConfirm ? 'text' : 'password'" required
                           x-model="confirmPassword"
                           class="block w-full pl-9 pr-10 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           :class="{ 'border-rose-400 dark:border-rose-600 focus:ring-rose-500': !isMatching }"
                           placeholder="Re-enter new password">
                    <button type="button" @click="showConfirm = !showConfirm" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i :data-lucide="showConfirm ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                    </button>
                </div>
                <template x-if="!isMatching">
                    <p class="text-[11px] text-rose-500 mt-1 flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 inline"></i>
                        Passwords do not match
                    </p>
                </template>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 flex items-center justify-between gap-3">
                <a href="{% url 'dashboard' %}"
                   class="w-1/2 py-2 px-4 border border-slate-300 dark:border-slate-700 rounded-lg shadow-sm text-xs font-semibold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-750 focus:outline-none text-center transition-colors">
                    Cancel
                </a>
                <button type="submit"
                        :disabled="!isMatching || !newPassword || !oldPassword"
                        class="w-1/2 py-2 px-4 border border-transparent rounded-lg shadow-sm text-xs font-semibold text-white bg-brand-600 hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-1.5">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
