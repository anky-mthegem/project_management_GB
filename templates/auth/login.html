{% extends 'base.html' %}

{% block title %}Sign In - Milestone Management{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-slate-50 via-slate-100 to-slate-200 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950"
     x-data="{ 
         fillTrial() {
             document.getElementById('username').value = 'skhande';
             document.getElementById('password').value = 'Godrej@123';
         },
         fillMaster() {
             document.getElementById('username').value = 'aman';
             document.getElementById('password').value = '123456';
         }
     }">

    <!-- Login Card -->
    <div class="max-w-md w-full space-y-5 bg-white/95 dark:bg-slate-900/90 p-7 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl backdrop-blur-xl">
        
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto mb-3 flex justify-center">
                <img src="/static/img/logo.png" alt="Milestone Management Logo" class="h-20 w-auto object-contain drop-shadow-md rounded-2xl p-1 bg-white border border-slate-200 dark:border-slate-700/40">
            </div>
            <h2 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                Sign in to your account
            </h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enterprise Project & Milestone Management</p>
        </div>

        <!-- Login Form -->
        <form class="mt-5 space-y-3.5" method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Username</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input id="username" name="username" type="text" required autofocus
                           class="block w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           placeholder="Enter username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input id="password" name="password" type="password" required
                           class="block w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           placeholder="••••••••">
                </div>
            </div>

            <div class="pt-1">
                <button type="submit"
                        class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-md text-xs font-semibold text-white bg-brand-600 hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all shadow-brand-500/25">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Sign in to Milestone Management
                </button>
            </div>
        </form>

        <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-800">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Don't have an account?
                <a href="{% url 'register' %}" class="font-medium text-brand-600 dark:text-brand-400 hover:text-brand-500 dark:hover:text-brand-300">
                    Create new account
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
